      - name: female_ratio_scope
      - name: female_ratio
      - name: female_managers
      - name: total_managers
      - name: female_manager_ratio
      - name: female_officers
      - name: total_officers
      - name: female_officer_ratio
      - name: childcare_leave_eligible_male
      - name: childcare_leave_taken_male
      - name: childcare_leave_ratio_male
      - name: childcare_leave_eligible_female
      - name: childcare_leave_taken_female
      - name: childcare_leave_ratio_female
