version: 2

models:
  - name: mart_gbizinfo_company
    description: gBizINFO の法人活動情報を法人 1 行に集約。基本属性(資本金・従業員数・設立年・業種)に補助金・調達の集計と最新財務・職場指標を加えたもの。corporate_number で国税庁法人番号(houjin_bangou)・全国地方公共団体コード(lg-code)と結合できる
    columns:
      - name: corporate_number
      - name: name
      - name: capital_stock
      - name: employee_number
      - name: date_of_establishment
      - name: founding_year
      - name: business_summary
      - name: business_items
      - name: representative_name
      - name: company_url
      - name: subsidy_count
      - name: subsidy_total_amount
      - name: procurement_count
      - name: procurement_total_award
      - name: latest_fiscal_year
      - name: latest_net_sales
      - name: latest_ordinary_income
      - name: latest_net_income
      - name: latest_total_assets
      - name: latest_net_assets
      - name: avg_age
      - name: avg_monthly_overtime
      - name: female_ratio
