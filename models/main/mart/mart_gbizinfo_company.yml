version: 2

models:
  - name: mart_gbizinfo_company
    description: gBizINFO の法人活動情報を法人 1 行に集約。基本属性(資本金・従業員数・設立年・業種)に補助金・調達の集計と最新財務・職場指標を加えたもの。corporate_number で国税庁法人番号(houjin_bangou)・全国地方公共団体コード(lg-code)と結合できる
    config:
      meta:
        title: 法人活動サマリ
        published: true
        source_url: "https://info.gbiz.go.jp/"
        credit: >-
          出典：gBizINFO（経済産業省）。
          gBizINFO 利用規約に基づき出典を明記して再配布しています。
          最新性・正確性・完全性等が保証されたものではありません
    columns:
      - name: corporate_number
        meta:
          title: 法人番号
          description: 13桁。国税庁法人番号(houjin_bangou)と結合できる
      - name: name
        meta:
          title: 商号または名称
      - name: capital_stock
        meta:
          title: 資本金
          description: 円
      - name: employee_number
        meta:
          title: 従業員数
      - name: date_of_establishment
        meta:
          title: 設立年月日
      - name: founding_year
        meta:
          title: 創業年
      - name: business_summary
        meta:
          title: 事業概要
      - name: business_items
        meta:
          title: 事業種目
      - name: representative_name
        meta:
          title: 代表者名称
      - name: company_url
        meta:
          title: WebサイトURL
      - name: subsidy_count
        meta:
          title: 補助金交付件数
      - name: subsidy_total_amount
        meta:
          title: 補助金交付総額
          description: 円
      - name: procurement_count
        meta:
          title: 調達(受注)件数
      - name: procurement_total_award
        meta:
          title: 調達(受注)落札総額
          description: 円
      - name: latest_fiscal_year
        meta:
          title: 最新事業年度
      - name: latest_net_sales
        meta:
          title: 売上高(最新)
          description: 円
      - name: latest_ordinary_income
        meta:
          title: 経常利益(最新)
          description: 円
      - name: latest_net_income
        meta:
          title: 当期純利益(最新)
          description: 円
      - name: latest_total_assets
        meta:
          title: 総資産額(最新)
          description: 円
      - name: latest_net_assets
        meta:
          title: 純資産額(最新)
          description: 円
      - name: avg_age
        meta:
          title: 従業員の平均年齢
      - name: avg_monthly_overtime
        meta:
          title: 月平均所定外労働時間
      - name: female_ratio
        meta:
          title: 女性労働者の割合
          description: ％
