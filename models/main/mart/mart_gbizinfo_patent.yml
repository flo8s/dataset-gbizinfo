version: 2

models:
  - name: mart_gbizinfo_patent
    description: gBizINFO の特許・意匠・商標の登録実績(1 件 1 行)。corporate_number で国税庁法人番号(houjin_bangou)と結合できる
    config:
      meta:
        title: 特許・意匠・商標
        published: true
        source_url: "https://info.gbiz.go.jp/"
        credit: >-
          出典：gBizINFO（経済産業省）。
          gBizINFO 利用規約に基づき出典を明記して再配布しています。
          最新性・正確性・完全性等が保証されたものではありません
    columns:
      - name: corporate_number
        meta:
          title: 法人番号
          description: 13桁。国税庁法人番号(houjin_bangou)と結合できる
      - name: name
        meta:
          title: 商号または名称
      - name: rights_type
        meta:
          title: 権利種別
          description: 特許 / 意匠 / 商標
      - name: registration_number
        meta:
          title: 登録番号
      - name: title
        meta:
          title: 発明の名称(等)
          description: 発明の名称 / 意匠に係る物品 / 表示用商標
      - name: classification
        meta:
          title: 分類名
          description: 権利種別に応じた分類名(特許 FI 分類 / 意匠新分類 / 商標類)
      - name: classification_code
        meta:
          title: 分類コード
          description: 権利種別に応じた分類コード値
      - name: document_url
        meta:
          title: 文献固定アドレス
      - name: application_date
        meta:
          title: 出願年月日
