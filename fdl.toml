name = "gbizinfo"
command = "python main.py"

[targets.default]
url = "s3://${FDL_S3_BUCKET}"
public_url = "https://data.queria.io"
s3_endpoint = "${FDL_S3_ENDPOINT}"
s3_access_key_id = "${FDL_S3_ACCESS_KEY_ID}"
s3_secret_access_key = "${FDL_S3_SECRET_ACCESS_KEY}"

[targets.local]
url = "~/.local/share/fdl"
public_url = "http://localhost:4001"

[meta]
license = "gBizINFO 利用規約準拠（出典明記のうえ商用利用可）"
license_url = "https://info.gbiz.go.jp/agreement/index.html"
title = "gBizINFO 法人活動情報"
description = "経済産業省 gBizINFO が公開する法人活動情報。法人番号をキーに、基本情報（資本金・従業員数・設立年・業種）、補助金、調達、財務、職場情報を収録。国税庁法人番号と結合できる"
cover = "🏛️"
tags = ['法人', '企業活動', '補助金', '調達', '財務', '経済産業省']
repository_url = "https://github.com/queria-io/dataset-gbizinfo"
source_url = "https://info.gbiz.go.jp/"
schedule = "monthly"

[meta.schemas.main]
title = "法人活動情報"
