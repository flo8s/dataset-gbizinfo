name: Sync (activity)

# 活動データ (補助金・調達・財務・職場、計約220MB) を日次で取得して再ビルドする。
# gBizINFO のファイルは日次更新されるため鮮度を上げる目的。基本情報 (1.7GB) は
# 据え置き、月次の Sync (full) で更新する。
# トークンはこのリポジトリ専用の Repository secret GBIZINFO_API_TOKEN を使う。

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 06:00 JST
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      GBIZINFO_SYNC_MODE: activity
      FDL_S3_ENDPOINT: https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com
      FDL_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      FDL_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      FDL_S3_BUCKET: ${{ vars.S3_BUCKET }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      GBIZINFO_API_TOKEN: ${{ secrets.GBIZINFO_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.13

      # fdl (frozen-ducklake) はベータ開発中のため、常に最新版を使用する
      - run: uv lock --upgrade-package frozen-ducklake && uv sync

      - name: Build and push
        run: scripts/build.sh default

      - name: Generate app token
        id: app-token
        if: success()
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: queria-io
          repositories: dataset-catalog

      - name: Trigger catalog rebuild
        if: success()
        run: |
          gh api repos/queria-io/dataset-catalog/dispatches \
            -f event_type=dataset-updated \
            -f "client_payload[dataset]=gbizinfo"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  notify-failure:
    runs-on: ubuntu-latest
    needs: sync
    if: failure()
    steps:
      - name: Notify Discord on failure
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\": [{\"title\": \"Sync (activity) Failed\", \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"color\": 15158332, \"fields\": [{\"name\": \"Repository\", \"value\": \"${{ github.repository }}\"}, {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\"}, {\"name\": \"Commit\", \"value\": \"${{ github.sha }}\"}]}]}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"
